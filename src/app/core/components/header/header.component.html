<nav class="container flex flex-wrap items-center justify-between gap-4 my-6 px-3">
  <!-- Logo -->
  <div class="area-logo flex items-center font-sans font-bold text-xl sm:text-2xl md:text-3xl lg:text-4xl">
    <img class="logo w-12 sm:w-16 md:w-20 lg:w-24" src="./icons/icon.png" alt="Logo" />
    <span class="ml-2 sm:ml-4 text-blue-800 dark:text-gray-50 logo-text">MyLU</span>
  </div>
 
  <!-- Navigation buttons - hidden on very small screens -->
  <div class="hidden sm:flex gap-2 md:gap-4 order-3 sm:order-2 w-full sm:w-auto justify-center sm:justify-start">
    <button
      class="text-white bg-gradient-to-r from-blue-500 to-blue-700 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800 shadow-lg shadow-blue-500/50 dark:shadow-lg dark:shadow-blue-800/80 font-medium rounded-lg text-sm px-4 py-2 text-center"
      type="button"
    >
      Courses
    </button>
    <button
      class="text-white bg-gradient-to-r from-indigo-500 to-indigo-700 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-indigo-300 dark:focus:ring-indigo-800 shadow-lg shadow-indigo-500/50 dark:shadow-lg dark:shadow-indigo-800/80 font-medium rounded-lg text-sm px-4 py-2 text-center"
      type="button"
    >
      University
    </button>
  </div>

  <!-- Theme toggle and user actions -->
  <div class="flex items-center space-x-3 order-2 sm:order-3">
    
      <button
        id="theme-toggle"
        (click)="toggleTheme()"
        class="theme md:mr-4 relative bottom-1 text-gray-500 dark:text-gray-400 dark:hover:bg-gray-700 active:outline-none active:ring-4 active:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-1 sm:p-2"
      >
        <!-- Dark SVG Icon -->
        <svg
          id="theme-toggle-dark-icon"
          class="w-4 h-4 sm:w-5 sm:h-5"
          [class.hidden]="!darkOn()"
          fill="currentColor"
          viewBox="0 0 20 20"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
        </svg>
        <!-- Light SVG Icon -->
        <svg
          id="theme-toggle-light-icon"
          class="w-4 h-4 sm:w-5 sm:h-5 text-darkBlue1"
          [class.hidden]="darkOn()"
          fill="currentColor"
          viewBox="0 0 20 20"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
            fill-rule="evenodd"
            clip-rule="evenodd"
          ></path>
        </svg>
        
      </button>
    
    <!-- Login button - visible on larger screens -->
    
  </div>

  <!-- Hamburger Menu - visible only on very small screens -->
  <button id="menu-btn" class="sm:hidden focus:outline-none" aria-label="Open menu">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Mobile menu - hidden by default, show/hide with JavaScript -->
  <div id="mobile-menu" class="hidden sm:hidden w-full order-4">
    <div class="flex flex-col items-center gap-4 mt-4">
      <button
        class="w-full text-white bg-gradient-to-r from-blue-500 to-blue-700 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800 shadow-lg shadow-blue-500/50 dark:shadow-lg dark:shadow-blue-800/80 font-medium rounded-lg text-sm px-4 py-2 text-center"
        type="button"
      >
        Courses
      </button>
      <button
        class="w-full text-white bg-gradient-to-r from-indigo-500 to-indigo-700 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-indigo-300 dark:focus:ring-indigo-800 shadow-lg shadow-indigo-500/50 dark:shadow-lg dark:shadow-indigo-800/80 font-medium rounded-lg text-sm px-4 py-2 text-center"
        type="button"
      >
        University
      </button>
      <button
        class="w-full flex items-center justify-center gap-1 p-2 text-blue-700 hover:text-blue-800 dark:text-blue-300 dark:hover:text-blue-200"
        type="button"
      >
        <i class="fas fa-user-circle text-xl"></i>
        <span>Login</span>
      </button>
    </div>
  </div>
</nav>
